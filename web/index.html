<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mini-faceIQ</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101114;
      --panel: #17191f;
      --line: #2b2f3a;
      --text: #f6f7fb;
      --muted: #aab1c2;
      --cyan: #2dd4bf;
      --blue: #60a5fa;
      --red: #fb7185;
      --green: #86efac;
      --amber: #fbbf24;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    main {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(320px, 420px) minmax(0, 1fr);
      transition: grid-template-columns 180ms ease;
    }
    main.uploadCollapsed {
      grid-template-columns: 58px minmax(0, 1fr);
    }
    aside {
      border-right: 1px solid var(--line);
      background: var(--panel);
      padding: 20px;
      overflow-y: auto;
      max-height: 100vh;
    }
    main.uploadCollapsed aside {
      padding: 14px 10px;
      overflow: hidden;
    }
    section { padding: 20px; min-width: 0; }
    h1, h2, p { margin: 0; }
    h1 { font-size: 24px; line-height: 1.1; }
    h2 { font-size: 16px; margin-top: 22px; margin-bottom: 10px; }
    p { color: var(--muted); margin-top: 8px; line-height: 1.45; }
    label { display: block; color: var(--muted); font-size: 13px; margin: 14px 0 6px; }
    select, input[type="file"] {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--line);
      background: #0f1218;
      color: var(--text);
      border-radius: 6px;
    }
    button {
      border: 1px solid var(--line);
      background: #242936;
      color: var(--text);
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
    }
    button.primary { background: var(--cyan); color: #051312; border-color: transparent; }
    button.success { background: var(--green); color: #06140b; border-color: transparent; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .row { display: flex; gap: 8px; align-items: center; }
    .row > * { flex: 1; }
    .topTabs {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 14px;
    }
    .tabBtn.active,
    .modeBtn.active {
      background: var(--cyan);
      color: #051312;
      border-color: transparent;
    }
    .subTabs {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin: 12px 0;
    }
    .tabPanel { display: none; }
    main.tab-upload .uploadPanel,
    main.tab-landmarks .landmarkPanel,
    main.tab-measurements .measurementPanel,
    main.tab-summary .summaryPanel {
      display: block;
    }
    main.tab-upload .viewerPane,
    main.tab-summary .viewerPane,
    main.tab-upload .resultsPane,
    main.tab-landmarks .score,
    main.tab-landmarks .resultsToolbar,
    main.tab-landmarks .metrics,
    main.tab-measurements .measurementCatalog,
    main.tab-summary .measurementCatalog,
    main.tab-summary .resultsToolbar,
    main.tab-summary .metrics {
      display: none;
    }
    .uploadHeader {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      justify-content: space-between;
    }
    .uploadTitle { min-width: 0; }
    .collapseBtn {
      flex: 0 0 auto;
      width: 34px;
      height: 34px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      line-height: 1;
    }
    .collapseBtn::before { content: "<"; }
    main.uploadCollapsed .collapseBtn::before { content: ">"; }
    main.uploadCollapsed .uploadBody,
    main.uploadCollapsed .uploadTitle {
      display: none;
    }
    .current {
      margin-top: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      background: #11141a;
    }
    .current strong { color: var(--cyan); }
    .progress {
      height: 8px;
      background: #0f1218;
      border: 1px solid var(--line);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 12px;
    }
    .bar { height: 100%; width: 0; background: var(--cyan); }
    .analysisLayout {
      display: grid;
      grid-template-columns: minmax(420px, 1.35fr) minmax(320px, 0.85fr);
      gap: 16px;
      align-items: start;
    }
    main.uploadCollapsed .analysisLayout {
      grid-template-columns: minmax(520px, 1.55fr) minmax(340px, 0.9fr);
    }
    .viewerPane {
      position: sticky;
      top: 20px;
      min-width: 0;
    }
    .resultsPane {
      min-width: 0;
    }
    .canvasWrap {
      height: calc(100vh - 40px);
      min-height: 520px;
      border: 1px solid var(--line);
      background: #08090d;
      border-radius: 8px;
      overflow: hidden;
    }
    canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
    .metrics {
      margin-top: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: visible;
    }
    .resultsToolbar {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 18px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }
    .resultsToolbar.active { display: flex; }
    .resultsToolbar label {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }
    .toolbarControls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toolbarControls select {
      width: min(220px, 100%);
      padding: 8px 10px;
    }
    .copyScoresBtn {
      flex: 0 0 auto;
      padding: 8px 10px;
      white-space: nowrap;
    }
    .metric {
      display: grid;
      grid-template-columns: minmax(150px, 1.35fr) minmax(70px, 0.45fr) 56px minmax(112px, 0.6fr);
      gap: 8px;
      padding: 10px 12px;
      border-top: 1px solid var(--line);
      align-items: center;
      font-size: 13px;
    }
    .confirmNote {
      margin-top: 10px;
      color: var(--green);
      font-size: 13px;
      font-weight: 700;
      min-height: 18px;
    }
    .metric > span { min-width: 0; }
    .metric:first-child { border-top: 0; }
    .metric:not(.header) { cursor: default; }
    .metric:not(.header):hover, .metric.active { background: #17202a; }
    .metric.header { color: var(--muted); background: #141821; font-weight: 700; }
    .metricName {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .metricName span:first-child {
      overflow-wrap: anywhere;
    }
    .help {
      position: relative;
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 17px;
      height: 17px;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--cyan);
      background: #0f1218;
      font-size: 11px;
      font-weight: 900;
      line-height: 1;
      cursor: help;
    }
    .help:hover::after, .help:focus::after {
      content: attr(data-tip);
      position: absolute;
      left: 50%;
      bottom: calc(100% + 8px);
      z-index: 5;
      width: min(260px, 72vw);
      transform: translateX(-50%);
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #08090d;
      color: var(--text);
      padding: 9px 10px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
      font-size: 12px;
      font-weight: 600;
      line-height: 1.35;
      white-space: normal;
    }
    .measurementCatalog {
      margin-top: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: #11141a;
    }
    .measurementCatalog.collapsed .catalogHeader {
      border-bottom: 0;
    }
    .measurementCatalog.collapsed .catalogItem {
      display: none;
    }
    .catalogHeader {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 12px;
      background: #141821;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }
    .catalogItem {
      display: grid;
      grid-template-columns: minmax(180px, 0.9fr) minmax(220px, 1.4fr) 84px;
      gap: 12px;
      padding: 10px 12px;
      border-top: 1px solid var(--line);
      align-items: start;
      font-size: 13px;
    }
    .catalogItem:first-child { border-top: 0; }
    .catalogName { font-weight: 700; }
    .catalogDesc { color: var(--muted); line-height: 1.35; }
    .pill {
      display: inline-flex;
      justify-content: center;
      width: fit-content;
      max-width: 100%;
      min-width: 0;
      padding: 3px 8px;
      border-radius: 999px;
      background: #242936;
      color: var(--muted);
      text-align: center;
      white-space: normal;
    }
    .ideal { color: var(--green); }
    .low, .high { color: var(--amber); }
    .ready { color: var(--green); }
    .waiting { color: var(--amber); }
    .score {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(104px, 1fr));
      gap: 10px;
      margin-top: 16px;
    }
    .stat {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: var(--panel);
    }
    .stat b { font-size: 24px; display: block; }
    .stat span { color: var(--muted); font-size: 12px; }
    textarea {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #0f1218;
      color: var(--text);
      padding: 10px;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 12px;
    }
    @media (max-width: 1220px) {
      main:not(.uploadCollapsed) .analysisLayout {
        grid-template-columns: 1fr;
      }
      main:not(.uploadCollapsed) .viewerPane {
        position: static;
      }
      main:not(.uploadCollapsed) .canvasWrap {
        height: min(74vh, 760px);
      }
    }
    @media (max-width: 980px) {
      main.uploadCollapsed .analysisLayout {
        grid-template-columns: 1fr;
      }
      main.uploadCollapsed .viewerPane {
        position: static;
      }
    }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
      main.uploadCollapsed { grid-template-columns: 1fr; }
      aside { max-height: none; border-right: 0; border-bottom: 1px solid var(--line); }
      main.uploadCollapsed aside { max-height: 62px; }
      .analysisLayout { grid-template-columns: 1fr; }
      main.uploadCollapsed .analysisLayout { grid-template-columns: 1fr; }
      .viewerPane { position: static; }
      .canvasWrap { height: min(68vh, 620px); min-height: 360px; }
      .metric { grid-template-columns: minmax(0, 1fr) minmax(64px, 0.35fr) minmax(88px, 0.45fr); }
      .resultsToolbar { align-items: stretch; flex-direction: column; }
      .toolbarControls { align-items: stretch; flex-direction: column; }
      .toolbarControls select, .copyScoresBtn { width: 100%; }
      .catalogItem { grid-template-columns: 1fr; }
      .metric .hideMobile { display: none; }
      .score { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
<main id="appShell" class="tab-upload">
  <aside>
    <div class="uploadHeader">
      <div class="uploadTitle">
        <h1>mini-faceIQ</h1>
        <p id="introCopy">Place the front landmarks, then calculate the 30 front profile metrics.</p>
      </div>
      <button id="uploadToggle" class="collapseBtn" type="button" aria-label="Collapse upload section" aria-expanded="true"></button>
    </div>

    <div class="uploadBody">
      <div class="tabPanel uploadPanel">
        <label id="frontImageLabel" for="frontImageInput">Upload front profile</label>
        <input id="frontImageInput" type="file" accept="image/*">
        <label id="sideImageLabel" for="sideImageInput">Upload side profile</label>
        <input id="sideImageInput" type="file" accept="image/*">
        <button id="uploadConfirmBtn" class="primary" style="width:100%; margin-top:8px">Confirm uploads</button>
        <div id="uploadConfirmNote" class="confirmNote"></div>

        <div class="row">
          <div>
            <label for="gender">Gender</label>
            <select id="gender">
              <option value="male">male</option>
              <option value="female">female</option>
            </select>
          </div>
          <div>
            <label for="ethnicity">Ethnicity</label>
            <select id="ethnicity">
              <option value="asian">asian</option>
              <option value="caucasian">caucasian</option>
              <option value="black">black</option>
              <option value="hispanic">hispanic</option>
              <option value="middle_eastern">middle_eastern</option>
              <option value="south_asian">south_asian</option>
              <option value="mixed">mixed</option>
            </select>
          </div>
        </div>
      </div>

      <div class="tabPanel landmarkPanel">
        <div class="subTabs">
          <button class="modeBtn" data-profile-target="side" type="button">Side landmarks</button>
          <button class="modeBtn" data-profile-target="front" type="button">Front landmarks</button>
        </div>
        <button id="autoBtn" class="success" style="width:100%; margin-top:8px">Auto-detect landmarks</button>

        <div class="current">
          <span id="stepText">Load an image to begin.</span>
          <p id="stepHint">Your clicks are stored as normalized x/y points, so image size does not matter.</p>
          <div class="progress"><div id="progressBar" class="bar"></div></div>
        </div>

        <h2>Controls</h2>
        <div class="row">
          <button id="prevBtn">Back</button>
          <button id="nextBtn">Next</button>
        </div>
        <div class="row" style="margin-top:8px">
          <button id="undoBtn">Undo point</button>
          <button id="clearBtn">Clear all</button>
        </div>
        <button id="landmarkConfirmBtn" class="primary" style="width:100%; margin-top:8px">Confirm landmarks</button>
        <div id="landmarkConfirmNote" class="confirmNote"></div>

        <h2>Landmark JSON</h2>
        <textarea id="jsonBox" spellcheck="false"></textarea>
        <button id="loadJsonBtn" style="width:100%; margin-top:8px">Load JSON into canvas</button>
      </div>

      <div class="tabPanel measurementPanel">
        <div class="subTabs">
          <button class="modeBtn" data-profile-target="side" type="button">Side profile</button>
          <button class="modeBtn" data-profile-target="front" type="button">Front profile</button>
        </div>
        <button id="calcBtn" class="primary" style="width:100%; margin-top:8px">Calculate current profile</button>
        <button id="calcAllBtn" class="primary" style="width:100%; margin-top:8px">Calculate both profiles</button>
      </div>

      <div class="tabPanel summaryPanel">
        <div class="current">
          <span>Summary</span>
          <p>Scores appear here after calculation.</p>
        </div>
      </div>
    </div>
  </aside>

  <section>
    <div class="topTabs">
      <button class="tabBtn active" data-tab="upload" type="button">Upload</button>
      <button class="tabBtn" data-tab="landmarks" type="button">Landmarks</button>
      <button class="tabBtn" data-tab="measurements" type="button">Measurements</button>
      <button class="tabBtn" data-tab="summary" type="button">Summary</button>
    </div>
    <div class="analysisLayout">
      <div class="viewerPane">
        <div class="canvasWrap"><canvas id="canvas"></canvas></div>
      </div>
      <div class="resultsPane">
        <div id="score" class="score"></div>
        <div id="measurementCatalog" class="measurementCatalog"></div>
        <div id="resultsToolbar" class="resultsToolbar">
          <label for="metricSort">Scoring</label>
          <div class="toolbarControls">
            <select id="metricSort">
              <option value="default">default order</option>
              <option value="score-desc">highest score first</option>
              <option value="score-asc">lowest score first</option>
            </select>
            <button id="copyScoresBtn" class="copyScoresBtn" type="button">Copy scores</button>
          </div>
        </div>
        <div id="metrics" class="metrics"></div>
      </div>
    </div>
  </section>
</main>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const appShell = document.getElementById("appShell");
const uploadToggle = document.getElementById("uploadToggle");
const profileModeInput = document.getElementById("profileMode");
const introCopy = document.getElementById("introCopy");
const frontImageInput = document.getElementById("frontImageInput");
const sideImageInput = document.getElementById("sideImageInput");
const stepText = document.getElementById("stepText");
const stepHint = document.getElementById("stepHint");
const progressBar = document.getElementById("progressBar");
const jsonBox = document.getElementById("jsonBox");
const uploadConfirmBtn = document.getElementById("uploadConfirmBtn");
const uploadConfirmNote = document.getElementById("uploadConfirmNote");
const landmarkConfirmBtn = document.getElementById("landmarkConfirmBtn");
const landmarkConfirmNote = document.getElementById("landmarkConfirmNote");
const metricsEl = document.getElementById("metrics");
const measurementCatalogEl = document.getElementById("measurementCatalog");
const scoreEl = document.getElementById("score");
const resultsToolbar = document.getElementById("resultsToolbar");
const metricSort = document.getElementById("metricSort");
const copyScoresBtn = document.getElementById("copyScoresBtn");
const calcBtn = document.getElementById("calcBtn");
const calcAllBtn = document.getElementById("calcAllBtn");
const autoBtn = document.getElementById("autoBtn");
let currentMeasurements = [];
let hasCalculatedResults = false;
const frontMeasurementDefs = [
  {id: "lateral_canthal_tilt", name: "Lateral Canthal Tilt", category: "Eyes", description: "Eye angle relative to horizontal.", requires: ["left_medial_canthus", "left_lateral_canthus", "right_medial_canthus", "right_lateral_canthus"]},
  {id: "nose_bridge_to_width", name: "Nose Bridge to Nose Width Ratio", category: "Nose", description: "Nose side width compared with nose bridge width.", requires: ["left_nose_side", "right_nose_side", "left_nose_bridge", "right_nose_bridge"]},
  {id: "bitemporal_width", name: "Bitemporal Width", category: "Head", description: "Temple width compared with cheekbone face width.", requires: ["left_temple", "right_temple", "left_cheekbone", "right_cheekbone"]},
  {id: "cheekbone_height", name: "Cheekbone Height", category: "Cheeks", description: "Vertical positioning of cheekbones.", requires: ["cupids_bow", "left_cheekbone", "right_cheekbone", "left_pupil", "right_pupil"]},
  {id: "cupids_bow_depth", name: "Cupid's Bow Depth", category: "Mouth", description: "Vertical depth of the cupid's bow.", requires: ["cupids_bow", "inner_cupids_bow"]},
  {id: "bigonial_width", name: "Bigonial Width", category: "Jaw", description: "Jaw width compared with cheekbone face width.", requires: ["left_upper_jaw_angle", "right_upper_jaw_angle", "left_cheekbone", "right_cheekbone"]},
  {id: "jaw_slope", name: "Jaw Slope", category: "Jaw", description: "Average left and right jaw slope angles.", requires: ["left_cheekbone", "left_upper_jaw_angle", "left_lower_jaw_angle", "left_chin", "right_cheekbone", "right_upper_jaw_angle", "right_lower_jaw_angle", "right_chin"]},
  {id: "middle_third", name: "Middle Third", category: "Proportions", description: "Middle facial third relative to total face height.", requires: ["right_brow_head", "right_brow_inner_corner", "left_brow_head", "left_brow_inner_corner", "nasal_base", "hairline", "chin_bottom"]},
  {id: "eye_aspect_ratio", name: "Eye Aspect Ratio", category: "Eyes", description: "Width-to-height ratio of eyes.", requires: ["left_medial_canthus", "left_lateral_canthus", "left_upper_eyelid", "left_lower_eyelid", "right_medial_canthus", "right_lateral_canthus", "right_upper_eyelid", "right_lower_eyelid"]},
  {id: "mouth_corner_position", name: "Mouth Corner Position", category: "Mouth", description: "Mouth corner height relative to mouth middle.", requires: ["mouth_middle", "left_mouth_corner", "right_mouth_corner"]},
  {id: "eye_separation_ratio", name: "Eye Separation Ratio", category: "Eyes", description: "Interpupillary distance vs face width.", requires: ["left_pupil", "right_pupil", "left_cheekbone", "right_cheekbone"]},
  {id: "eyebrow_tilt", name: "Eyebrow Tilt", category: "Brows", description: "Brow angle from horizontal.", requires: ["left_brow_head", "left_brow_inner_corner", "left_brow_arch", "left_brow_peak", "right_brow_head", "right_brow_inner_corner", "right_brow_arch", "right_brow_peak"]},
  {id: "lower_third", name: "Lower Third", category: "Proportions", description: "Lower facial third relative to total face height.", requires: ["chin_bottom", "nasal_base", "hairline"]},
  {id: "face_width_to_height", name: "Face Width to Height Ratio", category: "Proportions", description: "Cheekbone width compared with midface height.", requires: ["left_cheekbone", "right_cheekbone", "cupids_bow", "right_brow_head", "right_brow_inner_corner", "left_brow_head", "left_brow_inner_corner"]},
  {id: "interpupillary_mouth_width", name: "Interpupillary-Mouth Width Ratio", category: "Proportions", description: "Mouth width compared with interpupillary distance.", requires: ["left_mouth_corner", "right_mouth_corner", "left_pupil", "right_pupil"]},
  {id: "jaw_frontal_angle", name: "Jaw Frontal Angle", category: "Jaw", description: "Angle between the left and right lower jaw lines.", requires: ["left_lower_jaw_angle", "left_chin", "right_lower_jaw_angle", "right_chin"]},
  {id: "intercanthal_nasal_width", name: "Intercanthal-Nasal Width Ratio", category: "Proportions", description: "Nasal width compared with inner eye corner spacing.", requires: ["left_nose_side", "right_nose_side", "left_medial_canthus", "right_medial_canthus"]},
  {id: "top_third", name: "Top Third", category: "Proportions", description: "Upper facial third relative to total face height.", requires: ["hairline", "right_brow_head", "right_brow_inner_corner", "left_brow_head", "left_brow_inner_corner", "chin_bottom"]},
  {id: "one_eye_apart", name: "One Eye Apart Test", category: "Proportions", description: "Intercanthal spacing validation.", requires: ["left_medial_canthus", "right_medial_canthus", "left_lateral_canthus", "right_lateral_canthus"]},
  {id: "midface_ratio", name: "Midface Ratio", category: "Proportions", description: "Interpupillary distance compared with midface height.", requires: ["left_pupil", "right_pupil", "inner_cupids_bow"]},
  {id: "ipsilateral_alar_angle", name: "Ipsilateral Alar Angle", category: "Nose", description: "Nasal base angle using eyelid hood endpoints.", requires: ["nasal_base", "left_eyelid_hood_end", "right_eyelid_hood_end"]},
  {id: "mouth_width_to_nose_width", name: "Mouth Width to Nose Width Ratio", category: "Proportions", description: "Mouth width compared with nose width.", requires: ["left_mouth_corner", "right_mouth_corner", "left_nose_side", "right_nose_side"]},
  {id: "total_facial_width_to_height", name: "Total Facial Width to Height Ratio", category: "Proportions", description: "Cheekbone width compared with full face height.", requires: ["hairline", "chin_bottom", "left_cheekbone", "right_cheekbone"]},

function fitCanvas() {
  const rect = canvas.getBoundingClientRect();
  const ratio = window.devicePixelRatio || 1;
  canvas.width = Math.max(1, Math.floor(rect.width * ratio));
  canvas.height = Math.max(1, Math.floor(rect.height * ratio));
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  draw();
}

function getDrawBox() {
  const cw = canvas.clientWidth;
  const ch = canvas.clientHeight;
  if (!imageLoaded || !image.width || !image.height) return {x: 0, y: 0, w: cw, h: ch};
  const ar = (image.width * viewCrop.w) / (image.height * viewCrop.h);
  const car = cw / ch;
  if (ar > car) {
    const w = cw;
    const h = w / ar;
    return applyViewTransform({x: 0, y: (ch - h) / 2, w, h});
  }
  const h = ch;
  const w = h * ar;
  const baseBox = {x: (cw - w) / 2, y: 0, w, h};
  return applyViewTransform(baseBox);
}

function applyViewTransform(baseBox) {
  const view = viewByProfile[profileMode];
  const scaledW = baseBox.w * view.scale;
  const scaledH = baseBox.h * view.scale;
  const centerX = baseBox.x + baseBox.w / 2 + view.offsetX;
  const centerY = baseBox.y + baseBox.h / 2 + view.offsetY;
  return {
    x: centerX - scaledW / 2,
    y: centerY - scaledH / 2,
    w: scaledW,
    h: scaledH
  };
}

function getZoomCrop() {
  const focusedIds = getActiveMeasurementLandmarkIds();
  if (!focusedIds || activeTab !== "measurements") return {x: 0, y: 0, w: 1, h: 1};
  const points = landmarks.filter(lm => focusedIds.has(lm.id));
  if (points.length < 2) return {x: 0, y: 0, w: 1, h: 1};
  const xs = points.map(lm => Number(lm.x));
  const ys = points.map(lm => Number(lm.y));
  const minX = Math.min(...xs);
  const maxX = Math.max(...xs);
  const minY = Math.min(...ys);
  const maxY = Math.max(...ys);
  const pad = Math.max(0.12, Math.max(maxX - minX, maxY - minY) * 0.85);
  const x = Math.max(0, minX - pad);
  const y = Math.max(0, minY - pad);
  return {
    x,
    y,
    w: Math.min(1 - x, Math.max(0.12, maxX - minX + pad * 2)),
    h: Math.min(1 - y, Math.max(0.12, maxY - minY + pad * 2))
  };
}

function draw() {
  ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
  viewCrop = getZoomCrop();
  drawBox = getDrawBox();
  ctx.fillStyle = "#08090d";
  ctx.fillRect(0, 0, canvas.clientWidth, canvas.clientHeight);
  if (imageLoaded) {
    ctx.drawImage(
      image,
      viewCrop.x * image.width,
      viewCrop.y * image.height,
      viewCrop.w * image.width,
      viewCrop.h * image.height,
      drawBox.x,
      drawBox.y,
      drawBox.w,
      drawBox.h
    );
  }

  const focusedIds = getActiveMeasurementLandmarkIds();
  const visibleLandmarks = focusedIds
    ? []
    : activeTab === "landmarks"
      ? landmarks.filter(lm => defs[index] && lm.id === defs[index].id)
    : landmarks;

  visibleLandmarks.forEach((lm) => {
    const def = defs.find(d => d.id === lm.id) || {};
    const i = defs.findIndex(d => d.id === lm.id);
    const x = drawBox.x + lm.x * drawBox.w;
    const y = drawBox.y + lm.y * drawBox.h;
    const color = def.color || "#2dd4bf";
    ctx.beginPath();
    ctx.arc(x, y, i === index ? 5 : 3.5, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#fff";
    ctx.stroke();
    ctx.font = "700 11px system-ui";
    ctx.textAlign = "center";
    ctx.fillStyle = "#fff";
    ctx.fillText(String(i + 1), x, y - 9);
  });

  drawActiveMeasurement();
}

function getActiveMeasurementLandmarkIds() {
  const guide = getMeasurementGuide(activeMetricId);
  if (!guide) return null;
  const ids = new Set();
  (guide.lines || []).forEach((line) => {
    ids.add(line[0]);
    ids.add(line[1]);
  });
  (guide.points || []).forEach((id) => ids.add(id));
  return ids;
}

function getMeasurementGuide(metricId) {
  if (!metricId) return null;
  if (MEASUREMENT_GUIDES[metricId]) return MEASUREMENT_GUIDES[metricId];
  const item = measurementDefs.find(def => def.id === metricId);
  if (!item || !Array.isArray(item.requires)) return null;
  const lines = [];
  for (let i = 0; i < item.requires.length - 1; i += 1) {
    lines.push([item.requires[i], item.requires[i + 1]]);
  }
  return {lines, points: item.requires};
}

function getLandmark(id) {
  return landmarks.find(lm => lm.id === id && Number.isFinite(Number(lm.x)) && Number.isFinite(Number(lm.y)));
}

function toCanvasPoint(lm) {
  return {
    x: drawBox.x + ((Number(lm.x) - viewCrop.x) / viewCrop.w) * drawBox.w,
    y: drawBox.y + ((Number(lm.y) - viewCrop.y) / viewCrop.h) * drawBox.h
  };
}

function drawGuidePoint(lm, label) {
  const point = toCanvasPoint(lm);
  ctx.beginPath();
  ctx.arc(point.x, point.y, 3.25, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(45, 212, 191, 0.95)";
  ctx.fill();
  ctx.lineWidth = 1.75;
  ctx.strokeStyle = "#051312";
  ctx.stroke();
  if (label) {
    ctx.font = "800 11px system-ui";
    ctx.textAlign = "center";
    ctx.fillStyle = "#f6f7fb";
    ctx.fillText(label, point.x, point.y - 13);
  }
}

function drawGuideLine(a, b, index) {
  const start = getLandmark(a);
  const end = getLandmark(b);
  if (!start || !end) return;
  const p1 = toCanvasPoint(start);
  const p2 = toCanvasPoint(end);
  ctx.save();
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.lineWidth = 5;
  ctx.strokeStyle = "rgba(0, 0, 0, 0.55)";
  ctx.beginPath();
  ctx.moveTo(p1.x, p1.y);
  ctx.lineTo(p2.x, p2.y);
  ctx.stroke();
  ctx.lineWidth = 2;
  ctx.strokeStyle = index === 0 ? "#2dd4bf" : "#fbbf24";
  ctx.setLineDash(index === 0 ? [] : [8, 6]);
  ctx.beginPath();
  ctx.moveTo(p1.x, p1.y);
  ctx.lineTo(p2.x, p2.y);
  ctx.stroke();
  ctx.restore();
  drawGuidePoint(start);
  drawGuidePoint(end);
}

function drawActiveMeasurement() {
  const guide = getMeasurementGuide(activeMetricId);
  if (!guide || !imageLoaded) return;
  (guide.lines || []).forEach((line, i) => drawGuideLine(line[0], line[1], i));
  (guide.points || []).forEach((id) => {
    const lm = getLandmark(id);
    if (lm) drawGuidePoint(lm);
  });
}

function syncUi() {
  const def = defs[index];
  const placed = landmarks.length;
  progressBar.style.width = defs.length ? `${placed / defs.length * 100}%` : "0%";
  calcBtn.disabled = defs.length === 0 || getMissingLandmarks().length > 0;
  calcAllBtn.disabled = !canCalculateBothProfiles();
  autoBtn.disabled = !imageLoaded;
  autoBtn.textContent = "Auto-detect landmarks";
  calcBtn.textContent = profileMode === "front" ? "Calculate front metrics" : "Calculate side metrics";
  document.querySelectorAll(".modeBtn").forEach((button) => {
    button.classList.toggle("active", button.dataset.profileTarget === profileMode);
  });
  introCopy.textContent = profileMode === "front"
    ? "Place the front landmarks, then calculate the 30 front profile metrics."
    : "Place the side landmarks, then calculate the side profile metrics.";
  if (def) {
    stepText.innerHTML = `<strong>${index + 1}/${defs.length}</strong> ${def.label}`;
    stepHint.textContent = "Click the image to place or replace this point.";
  } else {
    stepText.textContent = "Loading landmarks...";
    stepHint.textContent = "";
  }
  jsonBox.value = JSON.stringify(landmarks, null, 2);
  renderMeasurementCatalog();
  draw();
}

function getDefsForProfile(mode) {
  return defsByProfile[mode] || (mode === profileMode ? defs : []);
}

function getLandmarksForProfile(mode) {
  return landmarksByProfile[mode] || [];
}

function getMissingLandmarksForProfile(mode) {
  const profileDefs = getDefsForProfile(mode);
  const placedIds = new Set(
    getLandmarksForProfile(mode)
      .filter(lm => lm && Number.isFinite(Number(lm.x)) && Number.isFinite(Number(lm.y)))
      .map(lm => lm.id)
  );
  return profileDefs.filter(def => !placedIds.has(def.id));
}

function canCalculateBothProfiles() {
  return Boolean(
    imageLoadedByProfile.front &&
    imageLoadedByProfile.side &&
    getDefsForProfile("front").length &&
    getDefsForProfile("side").length &&
    getMissingLandmarksForProfile("front").length === 0 &&
    getMissingLandmarksForProfile("side").length === 0
  );
}

function getMissingLandmarks() {
  const placedIds = new Set(
    landmarks
      .filter(lm => lm && Number.isFinite(Number(lm.x)) && Number.isFinite(Number(lm.y)))
      .map(lm => lm.id)
  );
  return defs.filter(def => !placedIds.has(def.id));
}

function hasPlacedLandmark(id) {
  return landmarks.some(lm => lm && lm.id === id && Number.isFinite(Number(lm.x)) && Number.isFinite(Number(lm.y)));
}

function renderMeasurementCatalog() {
  const readyCount = measurementDefs.filter(item => item.requires.every(hasPlacedLandmark)).length;
  const shouldCollapse = hasCalculatedResults && readyCount === measurementDefs.length && currentMeasurements.length > 0;
  measurementCatalogEl.classList.toggle("collapsed", shouldCollapse);
  measurementCatalogEl.innerHTML = `
    <div class="catalogHeader">
      <span>Measurement checklist</span>
      <span>${shouldCollapse ? "all metrics calculated" : `${readyCount}/${measurementDefs.length} ready`}</span>
    </div>
    ${measurementDefs.map(item => {
      const missing = item.requires.filter(id => !hasPlacedLandmark(id));
      const state = missing.length === 0 ? "ready" : "waiting";
      const label = missing.length === 0 ? "ready" : `${missing.length} missing`;
      return `
        <div class="catalogItem">
          <div>
            <div class="catalogName">${item.name}</div>
            <div class="catalogDesc">${item.category}</div>
          </div>
          <div class="catalogDesc">${item.description}</div>
          <span class="pill ${state}">${label}</span>
        </div>
      `;
    }).join("")}
  `;
}

function setPoint(nx, ny) {
  if (!defs[index]) return;
  hasCalculatedResults = false;
  resultsByProfile[profileMode] = null;
  const def = defs[index];
  const next = landmarks.filter(l => l.id !== def.id);
  next.push({id: def.id, x: Number(nx.toFixed(6)), y: Number(ny.toFixed(6)), label: def.label});
  landmarks = next.sort((a, b) => defs.findIndex(d => d.id === a.id) - defs.findIndex(d => d.id === b.id));
  landmarksByProfile[profileMode] = landmarks;
  if (index < defs.length - 1) index += 1;
  syncUi();
}

canvas.addEventListener("click", (event) => {
  if (!imageLoaded) return;
  const rect = canvas.getBoundingClientRect();
  const x = event.clientX - rect.left;
  const y = event.clientY - rect.top;
  const nx = viewCrop.x + ((x - drawBox.x) / drawBox.w) * viewCrop.w;
  const ny = viewCrop.y + ((y - drawBox.y) / drawBox.h) * viewCrop.h;
  if (nx < 0 || nx > 1 || ny < 0 || ny > 1) return;
  setPoint(nx, ny);
});

canvas.addEventListener("wheel", (event) => {
  if (!imageLoaded) return;
  event.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const pointerX = event.clientX - rect.left;
  const pointerY = event.clientY - rect.top;
  const beforeX = (pointerX - drawBox.x) / drawBox.w;
  const beforeY = (pointerY - drawBox.y) / drawBox.h;
  const view = viewByProfile[profileMode];
  const nextScale = Math.min(5, Math.max(1, view.scale * (event.deltaY < 0 ? 1.12 : 0.88)));
  if (nextScale === view.scale) return;
  view.scale = nextScale;
  drawBox = getDrawBox();
  const afterX = drawBox.x + beforeX * drawBox.w;
  const afterY = drawBox.y + beforeY * drawBox.h;
  view.offsetX += pointerX - afterX;
  view.offsetY += pointerY - afterY;
  draw();
}, {passive: false});

async function loadProfileImage(mode, file) {
  if (!file) return;
  filesByProfile[mode] = file;
  landmarksByProfile[mode] = [];
  resultsByProfile[mode] = null;
  viewByProfile[mode] = {scale: 1, offsetX: 0, offsetY: 0};
  const url = URL.createObjectURL(file);
  const nextImage = new Image();
  imagesByProfile[mode] = nextImage;
  imageLoadedByProfile[mode] = false;
  nextImage.onload = () => {
    imageLoadedByProfile[mode] = true;
    if (profileMode === mode) {
      image = imagesByProfile[mode];
      imageLoaded = true;
      fitCanvas();
      syncUi();
    }
  };
  nextImage.src = url;

  if (profileMode !== mode) {
    setActiveTab("landmarks");
    await loadProfileDefs(mode);
    return;
  }

  activeMetricId = null;
  hasCalculatedResults = false;
  resultsByProfile[mode] = null;
  landmarks = [];
  index = 0;
  currentMeasurements = [];
  metricsEl.innerHTML = "";
  scoreEl.innerHTML = "";
  resultsToolbar.classList.remove("active");
  image = imagesByProfile[mode];
  imageLoaded = imageLoadedByProfile[mode];
  syncUi();
}

frontImageInput.addEventListener("change", () => {
  loadProfileImage("front", frontImageInput.files && frontImageInput.files[0]);
});

sideImageInput.addEventListener("change", () => {
  loadProfileImage("side", sideImageInput.files && sideImageInput.files[0]);
});

autoBtn.onclick = async () => {
  const file = filesByProfile[profileMode];
  if (!file) {
    alert(`Upload a ${profileMode} profile image first.`);
    return;
  }

  const previousText = autoBtn.textContent;
  autoBtn.disabled = true;
  autoBtn.textContent = "Detecting...";

  try {
    const form = new FormData();
    form.append("image", file);

    const endpoint = profileMode === "front" ? "/api/front-autolandmarks" : "/api/side-autolandmarks";
    const res = await fetch(endpoint, {
      method: "POST",
      body: form
    });
    const payload = await res.json();
    if (!payload.success) {
      alert(payload.error || "Auto-detect failed");
      return;
    }

    hasCalculatedResults = false;
    resultsByProfile[profileMode] = null;
    landmarks = (payload.landmarks || []).sort((a, b) => defs.findIndex(d => d.id === a.id) - defs.findIndex(d => d.id === b.id));
    landmarksByProfile[profileMode] = landmarks;
    const missing = getMissingLandmarks();
    const nextMissing = missing[0];
    index = nextMissing ? defs.findIndex(def => def.id === nextMissing.id) : Math.max(0, defs.length - 1);
    activeMetricId = null;
    metricsEl.innerHTML = "";
    scoreEl.innerHTML = "";
    syncUi();

    if (missing.length > 0) {
      alert(`Auto-detected ${landmarks.length} landmarks. Missing ${missing.length}; place the remaining points manually.`);
    }
  } catch (err) {
    alert(err.message || "Auto-detect failed");
  } finally {
    autoBtn.textContent = previousText;
    syncUi();
  }
};

document.getElementById("prevBtn").onclick = () => { index = Math.max(0, index - 1); syncUi(); };
document.getElementById("nextBtn").onclick = () => { index = Math.min(defs.length - 1, index + 1); syncUi(); };
document.getElementById("undoBtn").onclick = () => {
  const def = defs[index];
  if (!def) return;
  hasCalculatedResults = false;
  resultsByProfile[profileMode] = null;
  landmarks = landmarks.filter(l => l.id !== def.id);
  landmarksByProfile[profileMode] = landmarks;
  syncUi();
};
document.getElementById("clearBtn").onclick = () => {
  hasCalculatedResults = false;
  resultsByProfile[profileMode] = null;
  landmarks = [];
  landmarksByProfile[profileMode] = landmarks;
  index = 0;
  activeMetricId = null;
  metricsEl.innerHTML = "";
  scoreEl.innerHTML = "";
  syncUi();
};
document.getElementById("loadJsonBtn").onclick = () => {
  try {
    const parsed = JSON.parse(jsonBox.value);
    hasCalculatedResults = false;
    resultsByProfile[profileMode] = null;
    landmarks = Array.isArray(parsed) ? parsed : [];
    landmarksByProfile[profileMode] = landmarks;
    activeMetricId = null;
    syncUi();
  } catch (err) {
    alert(err.message);
  }
};

uploadToggle.onclick = () => {
  const collapsed = appShell.classList.toggle("uploadCollapsed");
  uploadToggle.setAttribute("aria-expanded", String(!collapsed));
  uploadToggle.setAttribute("aria-label", collapsed ? "Expand upload section" : "Collapse upload section");
  window.setTimeout(fitCanvas, 200);
};

function getProfileAspect(mode) {
  const profileImage = imagesByProfile[mode];
  return imageLoadedByProfile[mode] && profileImage.width && profileImage.height
    ? profileImage.width / profileImage.height
    : 1;
}

async function calculateProfile(mode) {
  const missing = getMissingLandmarksForProfile(mode);
  if (missing.length > 0) {
    throw new Error(`Place all ${mode} landmarks first. Missing ${missing.length}: ${missing.map(item => item.label).join(", ")}`);
  }

  const body = {
    gender: document.getElementById("gender").value,
    ethnicity: document.getElementById("ethnicity").value,
    landmarks: getLandmarksForProfile(mode)
  };
  if (mode === "front") {
    body.frontAspect = getProfileAspect("front");
  } else {
    body.sideAspect = getProfileAspect("side");
  }

  const res = await fetch(mode === "front" ? "/api/front-metrics" : "/api/side-metrics", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body)
  });
  const payload = await res.json();
  if (!payload.success) {
    throw new Error(payload.error || "Calculation failed");
  }
  return payload.data;
}

calcBtn.onclick = async () => {
  try {
    const data = await calculateProfile(profileMode);
    renderResults(data, profileMode);
  } catch (err) {
    alert(err.message || "Calculation failed");
  }
};

calcAllBtn.onclick = async () => {
  try {
    await fetchDefsForProfile("front");
    await fetchDefsForProfile("side");
    if (!canCalculateBothProfiles()) {
      const frontMissing = getMissingLandmarksForProfile("front").length;
      const sideMissing = getMissingLandmarksForProfile("side").length;
      alert(`Both profiles need complete uploads and landmarks first. Front missing: ${frontMissing}. Side missing: ${sideMissing}.`);
      syncUi();
      return;
    }
    const frontData = await calculateProfile("front");
    const sideData = await calculateProfile("side");
    resultsByProfile.front = frontData;
    resultsByProfile.side = sideData;
    renderStoredResults();
  } catch (err) {
    alert(err.message || "Calculation failed");
  }
};

function renderResults(data, mode = profileMode) {
  activeMetricId = null;
  hasCalculatedResults = true;
  resultsByProfile[mode] = data;
  renderStoredResults();
}

function renderStoredResults() {
  const frontData = resultsByProfile.front;
  const sideData = resultsByProfile.side;
  const activeData = resultsByProfile[profileMode];
  hasCalculatedResults = Boolean(activeData);
  currentMeasurements = activeData
    ? (profileMode === "front" ? (activeData.frontMeasurements || []) : (activeData.sideMeasurements || []))
    : [];
  const data = activeData || {};
  const metricTotal = profileMode === "front" ? 30 : 33;
  const groups = data.groups || {};
  const groupA = profileMode === "front" ? groups.G_F1 : groups.G_S1;
  const groupB = profileMode === "front" ? groups.G_F2 : groups.G_S2;
  const groupALabel = profileMode === "front" ? "proportions" : "profile";
  const groupBLabel = profileMode === "front" ? "eyes/brows" : "nose";
  const hasFrontScore = Boolean(frontData && (frontData.frontMeasurements || []).length);
  const hasSideScore = Boolean(sideData && (sideData.sideMeasurements || []).length);
  const frontScore = hasFrontScore ? frontData.frontScore : null;
  const sideScore = hasSideScore ? sideData.sideScore : null;
  const overallScore = hasFrontScore && hasSideScore
    ? (Number(frontScore) + Number(sideScore)) / 2
    : (hasFrontScore ? frontScore : sideScore);
  scoreEl.innerHTML = `
    <div class="stat"><b>${formatScoreValue(overallScore, hasFrontScore || hasSideScore)}</b><span>overall score</span></div>
    <div class="stat"><b>${formatScoreValue(frontScore, hasFrontScore)}</b><span>front score</span></div>
    <div class="stat"><b>${formatScoreValue(sideScore, hasSideScore)}</b><span>side score</span></div>
    <div class="stat"><b>${currentMeasurements.length}/${metricTotal}</b><span>metrics calculated</span></div>
    <div class="stat"><b>${formatScoreValue(groupA, Boolean(activeData))}</b><span>${groupALabel}</span></div>
    <div class="stat"><b>${formatScoreValue(groupB, Boolean(activeData))}</b><span>${groupBLabel}</span></div>
  `;
  resultsToolbar.classList.toggle("active", currentMeasurements.length > 0);
  renderMeasurementCatalog();
  renderMetricRows();
}

function formatScoreValue(score, isAvailable) {
  if (!isAvailable || score === null || score === undefined) return "--";
  return Number(score).toFixed(2).replace(/\.?0+$/, "");
}

function getSortedMeasurements() {
  const mode = metricSort.value;
  const ranked = currentMeasurements.map((item, order) => ({item, order}));
  if (mode === "score-desc") {
    ranked.sort((a, b) => (b.item.score - a.item.score) || a.order - b.order);
  } else if (mode === "score-asc") {
    ranked.sort((a, b) => (a.item.score - b.item.score) || a.order - b.order);
  }
  return ranked.map(entry => entry.item);
}

function renderMetricRows() {
  const sortedMeasurements = getSortedMeasurements();
  metricsEl.innerHTML = `
    <div class="metric header"><span>Metric</span><span>Value</span><span class="hideMobile">Score</span><span>Ideal fit</span></div>
    ${sortedMeasurements.map(item => `
      <div class="metric" data-metric-id="${item.id}">
        <span class="metricName">
          <span>${item.name}</span>
          <span class="help" tabindex="0" aria-label="${idealTip(item)}" data-tip="${idealTip(item)}">?</span>
        </span>
        <span>${item.value} ${unitLabel(item.unit)}</span>
        <span class="hideMobile">${item.score}/10</span>
        <span class="pill ${item.deviation}">${idealFitLabel(item.deviation)}</span>
      </div>
    `).join("")}
  `;
  bindMetricHover();
}

function idealFitLabel(deviation) {
  if (deviation === "ideal") return "ideal";
  if (deviation === "low") return "below ideal";
  if (deviation === "high") return "above ideal";
  return "unknown";
}

function formatMetricCopyLine(item) {
  return `${item.name} : ${item.value} ${unitLabel(item.unit)} ${item.score}/10`;
}

async function copyScores() {
  if (!currentMeasurements.length) return;
  const text = getSortedMeasurements().map(formatMetricCopyLine).join("\n");
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const copyBox = document.createElement("textarea");
    copyBox.value = text;
    copyBox.setAttribute("readonly", "");
    copyBox.style.position = "fixed";
    copyBox.style.left = "-9999px";
    document.body.appendChild(copyBox);
    copyBox.select();
    document.execCommand("copy");
    copyBox.remove();
  }
  const oldText = copyScoresBtn.textContent;
  copyScoresBtn.textContent = "Copied";
  window.setTimeout(() => { copyScoresBtn.textContent = oldText; }, 1200);
}

metricSort.addEventListener("change", () => {
  activeMetricId = null;
  renderMetricRows();
  draw();
});

copyScoresBtn.addEventListener("click", copyScores);

function setActiveTab(tab) {
  activeTab = tab;
  appShell.classList.remove("tab-upload", "tab-landmarks", "tab-measurements", "tab-summary");
  appShell.classList.add(`tab-${tab}`);
  document.querySelectorAll(".tabBtn").forEach((button) => {
    button.classList.toggle("active", button.dataset.tab === tab);
  });
  activeMetricId = null;
  if (tab === "summary" && (resultsByProfile.front || resultsByProfile.side)) {
    renderStoredResults();
  }
  window.setTimeout(fitCanvas, 0);
}

document.querySelectorAll(".tabBtn").forEach((button) => {
  button.addEventListener("click", () => {
    setActiveTab(button.dataset.tab);
  });
});

document.querySelectorAll(".modeBtn").forEach((button) => {
  button.addEventListener("click", () => {
    loadProfileDefs(button.dataset.profileTarget);
  });
});

uploadConfirmBtn.addEventListener("click", () => {
  const hasFront = Boolean(filesByProfile.front);
  const hasSide = Boolean(filesByProfile.side);
  uploadConfirmNote.textContent = hasFront && hasSide
    ? "Uploads confirmed."
    : `Need ${hasFront ? "" : "front "}${hasSide ? "" : "side "}image.`;
  if (hasFront && hasSide) setActiveTab("landmarks");
});

landmarkConfirmBtn.addEventListener("click", () => {
  const missing = getMissingLandmarks();
  landmarkConfirmNote.textContent = missing.length
    ? `${profileMode} still missing ${missing.length} landmark${missing.length === 1 ? "" : "s"}.`
    : `${profileMode} landmarks confirmed.`;
  if (!missing.length) setActiveTab("measurements");
});

function unitLabel(unit) {
  if (unit === "percentage") return "%";
  if (unit === "degrees") return "deg";
  if (unit === "ratio") return "x";
  return "px";
}

function idealTip(item) {
  const ideal = item.idealRange || [];
  const range = item.range || [];
  const unit = unitLabel(item.unit);
  return escapeAttr(`Ideal: ${formatRange(ideal, unit)}. Scored range: ${formatRange(range, unit)}. ${item.description || ""}`);
}

function formatRange(range, unit) {
  if (!Array.isArray(range) || range.length < 2) return "unknown";
  return `${Number(range[0]).toFixed(2)}-${Number(range[1]).toFixed(2)} ${unit}`;
}

function escapeAttr(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("\"", "&quot;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");
}

function bindMetricHover() {
  metricsEl.querySelectorAll(".metric[data-metric-id]").forEach((row) => {
    row.addEventListener("mouseenter", () => {
      activeMetricId = row.dataset.metricId;
      metricsEl.querySelectorAll(".metric.active").forEach(item => item.classList.remove("active"));
      row.classList.add("active");
      draw();
    });
    row.addEventListener("mouseleave", () => {
      activeMetricId = null;
      row.classList.remove("active");
      draw();
    });
  });
}

async function boot() {
  await loadProfileDefs("front");
  fitCanvas();
}

async function fetchDefsForProfile(mode) {
  if (defsByProfile[mode]) return defsByProfile[mode];
  const res = await fetch(mode === "front" ? "/api/front-landmarks" : "/api/side-landmarks");
  const payload = await res.json();
  defsByProfile[mode] = payload.landmarks || [];
  return defsByProfile[mode];
}

async function loadProfileDefs(nextMode) {
  landmarksByProfile[profileMode] = landmarks;
  profileMode = nextMode;
  if (profileModeInput) profileModeInput.value = profileMode;
  measurementDefs = profileMode === "front" ? frontMeasurementDefs : sideMeasurementDefs;
  defs = await fetchDefsForProfile(profileMode);
  image = imagesByProfile[profileMode];
  imageLoaded = imageLoadedByProfile[profileMode];
  landmarks = (landmarksByProfile[profileMode] || []).filter(lm => defs.some(def => def.id === lm.id));
  landmarksByProfile[profileMode] = landmarks;
  const missing = getMissingLandmarks();
  const nextMissing = missing[0];
  index = nextMissing ? defs.findIndex(def => def.id === nextMissing.id) : Math.max(0, defs.length - 1);
  activeMetricId = null;
  metricSort.value = "default";
  if (resultsByProfile[profileMode]) {
    renderStoredResults();
  } else {
    hasCalculatedResults = false;
    currentMeasurements = [];
    metricsEl.innerHTML = "";
    scoreEl.innerHTML = "";
    resultsToolbar.classList.remove("active");
  }
  syncUi();
}

if (profileModeInput) {
  profileModeInput.addEventListener("change", () => {
    loadProfileDefs(profileModeInput.value);
  });
}

window.addEventListener("resize", fitCanvas);
boot();
</script>
</body>
</html>
