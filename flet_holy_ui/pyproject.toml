[project]
name = "minifaceiq-holy-ui"
version = "0.3.0"
description = "Mini-FaceIQ Material 3 Android interface with offline manual geometry"
requires-python = ">=3.14,<3.15"
# The Flet app bundles pure-Python front/side scoring and landmark definitions.
# Do NOT include Linux requirements.txt until native ML components are ported:
# torch and Python mediapipe are not available in this Android runtime.
dependencies = ["flet==1.0.4"]

[tool.flet]
product = "Mini FaceIQ"
org = "dev.minifaceiq"

[tool.flet.app]
path = "src"
module = "main"

[tool.flet.splash]
color = "#0F1118"
dark_color = "#0F1118"

[tool.flet.android]
# One universal APK containing both ARM64 phones and x86-64 emulators/devices.
# Android ABI name x86_64 corresponds to AMD64 (not the literal name amd64).
min_sdk_version = 24
target_arch = ["arm64-v8a", "x86_64"]
split_per_abi = false
adaptive_icon_background = "#0F1118"
# CPU-only model inference dependencies with Android wheels, separated from Linux.
dependencies = [
    "numpy==2.4.6",
    "onnxruntime==1.27.0",
    "opencv-contrib-python==5.0.0.93",
]


# FilePicker uses Android's system picker and needs no broad storage
# permissions. The APK must run without Wi-Fi or a remote inference server.
# Keep Flet's default INTERNET manifest setting until its embedded runtime
# has been tested on-device without network access.
#
# Offline manual front/side geometry and CPU ONNX side models are bundled.
# Front MediaPipe and SCUT feature rating still require Android-native ports.
