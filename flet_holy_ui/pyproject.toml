[project]
name = "minifaceiq-holy-ui"
version = "0.2.0"
description = "Standalone-process Flet interface using local Mini-FaceIQ Python inference"
requires-python = ">=3.10,<3.12"
dependencies = ["flet==1.0.4"]

[tool.flet]
product = "Mini FaceIQ Holy UI"
org = "dev.minifaceiq"

[tool.flet.app]
path = "src"
module = "main"

# The native ML dependencies/model assets required for an Android APK are
# NOT yet available as compatible bundled Android artifacts.
