[project]
name = "flet-face-landmarker"
version = "0.1.0"
description = "FletFaceLandmarker control for Flet"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Flet contributors", email = "you@example.com" }
]
dependencies = [
    "flet>=1.0.4",
]

[dependency-groups]
dev = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]"
]

[project.urls]
Homepage = "https://mydomain.dev"
Documentation = "https://github.com/MyGithubAccount/flet-face-landmarker"
Repository = "https://github.com/MyGithubAccount/flet-face-landmarker"
Issues = "https://github.com/MyGithubAccount/flet-face-landmarker/issues"

[tool.setuptools.package-data]
"flutter.flet_face_landmarker" = ["**/*"]

[tool.setuptools]
license-files = []

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
