[project]
name = "minifaceiq-holy-ui"
version = "0.3.0"
description = "Offline Mini-FaceIQ with native MediaPipe, 3DDFA ONNX and SCUT ONNX"
requires-python = ">=3.14,<3.15"
# The Flet app bundles pure-Python front/side scoring and landmark definitions.
# Do NOT include Linux requirements.txt until native ML components are ported:
# torch and Python mediapipe are not available in this Android runtime.
dependencies = ["flet==1.0.4", "flet-face-landmarker"]

[tool.flet]
product = "Mini FaceIQ"
org = "dev.minifaceiq"

[tool.flet.app]
path = "src"
module = "main"

[tool.flet.splash]
color = "#0F1118"
dark_color = "#0F1118"

[tool.flet.android]
# Build only for modern ARM64 Android phones to avoid compiling and packaging
# the unused x86-64 emulator ABI.
min_sdk_version = 24
target_arch = ["arm64-v8a"]
split_per_abi = false
adaptive_icon_background = "#0F1118"
# CPU-only model inference dependencies with Android wheels, separated from Linux.
dependencies = [
    "numpy==2.4.6",
    "onnxruntime==1.27.0",
    "opencv-contrib-python==5.0.0.93",
    "pillow==12.2.0",
]
extract_packages = ["cv2", "PIL"]


# FilePicker uses Android's system picker and needs no broad storage
# permissions. The APK must run without Wi-Fi or a remote inference server.
# Keep Flet's default INTERNET manifest setting until its embedded runtime
# has been tested on-device without network access.
#
# Front MediaPipe is a bundled native Flet extension; 3DDFA and SCUT run via ONNX.
# TODO: validate scoring and model loading on an actual ARM64 Android phone.

# iOS uses the same bundled Flet UI and pure-Python geometry formulas.
# Automatic front detection uses the native MediaPipeTasksVision Swift plugin.
# Android ONNX wheels must NOT be added here; side + SCUT native iOS
# inference is not implemented, and the UI makes that limitation explicit.
[tool.flet.ios]
dependencies = []

[tool.flet.dev_packages]
flet-face-landmarker = "extensions/flet-face-landmarker"

[tool.uv.sources]
flet-face-landmarker = { path = "extensions/flet-face-landmarker", editable = true }
